<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#feda75;stop-opacity:1" />
      <stop offset="5%" style="stop-color:#fa7e1e;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#d92e7f;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#9b36b7;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#515bd4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with gradient -->
  <rect x="0" y="0" width="200" height="200" rx="50" fill="url(#igGradient)"/>
  
  <!-- Instagram camera icon -->
  <g transform="translate(100, 100)">
    <!-- Camera body -->
    <rect x="-35" y="-30" width="70" height="60" rx="8" fill="none" stroke="white" stroke-width="2.5"/>
    <!-- Camera lens -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="white" stroke-width="2.5"/>
    <!-- Flash -->
    <circle cx="-20" cy="-18" r="3.5" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Instagram</text>
</svg>